<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <title>LocalDock</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M32 12v26M32 38l-9-9M32 38l9-9' stroke='%2399f6e4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M16 48h32' stroke='%2399f6e4' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <!-- TOP HEADER -->
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#0f766e" />
          <path d="M32 12v26M32 38l-9-9M32 38l9-9" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M16 48h32" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" />
        </svg>
        <div>
          <h1>LocalDock</h1>
          <p class="tagline" data-i="tagline"></p>
        </div>
      </div>
      <select id="lang" class="lang" aria-label="Language"></select>
    </header>

    <!-- UPDATE NOTIFICATION BANNER -->
    <section id="updateBanner" class="update-banner hidden"></section>

    <!-- VIEW: DISCOVER (default) -->
    <main id="view-discover" class="view active">
      <section id="notice" class="notice hidden"></section>

      <!-- LOCAL MEDIA & DOCUMENT STUDIO HERO CARD -->
      <section id="openLocalStudioCard" class="studio-launch-card" role="button" tabindex="0">
        <div class="studio-launch-info">
          <div class="studio-launch-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="20" x="2" y="2" rx="2.18" ry="2.18"/>
              <line x1="7" x2="7" y1="2" y2="22"/>
              <line x1="17" x2="17" y1="2" y2="22"/>
              <line x1="2" x2="22" y1="12" y2="12"/>
              <line x1="2" x2="7" y1="7" y2="7"/>
              <line x1="2" x2="7" y1="17" y2="17"/>
              <line x1="17" x2="22" y1="17" y2="17"/>
              <line x1="17" x2="22" y1="7" y2="7"/>
            </svg>
          </div>
          <div class="studio-launch-text">
            <h3>استوديو ومشغل الملفات المحلية</h3>
            <p>تشغيل الفيديوهات، الصوتيات، الصور، PDF، المستندات والنصوص</p>
          </div>
        </div>
        <div class="studio-launch-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </div>
      </section>

      <!-- Scan status row -->
      <section class="scan-row">
        <div>
          <h2 data-i="discoveryTitle"></h2>
          <p class="muted" id="scanHint" data-i="looking"></p>
        </div>
        <button id="rescan" class="btn ghost compact" type="button">
          <span class="spin" aria-hidden="true">↻</span><span data-i="rescan"></span>
        </button>
      </section>

      <!-- Radar animation (while scanning) -->
      <section id="radar" class="radar-wrap" aria-live="polite">
        <div class="radar">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
        </div>
        <p class="muted" data-i="lookingHint"></p>
      </section>

      <!-- Host list -->
      <section id="hosts" class="hosts hidden"></section>

      <!-- FAB: pair options -->
      <div class="fab-row">
        <button id="openQrScan" class="btn secondary fab-btn qr-fab" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="qr-btn-icon"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> <span data-i="scanQrBtn"></span>
        </button>
        <button id="openPair" class="btn primary fab-btn" type="button" data-i="pairCta"></button>
      </div>
    </main>

    <!-- VIEW: PAIR (step wizard) -->
    <main id="view-pair" class="view hidden">
      <!-- Step indicator -->
      <div class="stepper">
        <div class="step active" id="step-dot-1">
          <div class="step-dot"><span>1</span></div>
          <div class="step-label" data-i="stepServer"></div>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step-dot-2">
          <div class="step-dot"><span>2</span></div>
          <div class="step-label" data-i="stepCode"></div>
        </div>
      </div>

      <!-- STEP 1: Choose server -->
      <section id="step1" class="card step-content">
        <div class="step-header">
          <button class="btn icon back-btn" id="backToDiscover" type="button">←</button>
          <h3 data-i="chooseServerTitle"></h3>
        </div>
        <p class="muted" data-i="chooseServerHint"></p>

        <!-- Discovered servers list -->
        <div id="pairServerList" class="server-list"></div>

        <!-- Manual entry toggle -->
        <button id="toggleManual" class="btn ghost wide manual-toggle" type="button">
          <span class="toggle-icon">＋</span> <span data-i="manualTitle"></span>
        </button>

        <div id="manualEntry" class="manual-entry hidden">
          <label class="lbl" for="manualHost" data-i="manualHint"></label>
          <input id="manualHost" class="field" placeholder="192.168.1.3:3000"
            inputmode="url" autocomplete="off" spellcheck="false" />
          <p id="manualError" class="error hidden"></p>
        </div>

        <button id="step1Next" class="btn primary wide" type="button" data-i="next"></button>
      </section>

      <!-- STEP 2: Enter code -->
      <section id="step2" class="card step-content hidden">
        <div class="step-header">
          <button class="btn icon back-btn" id="backToStep1" type="button">←</button>
          <h3 data-i="enterCodeTitle"></h3>
        </div>

        <!-- selected server preview -->
        <div class="selected-server" id="selectedServerPreview"></div>

        <p class="muted" data-i="pairHint"></p>

        <!-- Code input: 6 individual boxes -->
        <div class="code-boxes" id="codeBoxes">
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <span class="code-sep">-</span>
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
          <input class="code-box" maxlength="1" autocomplete="off" spellcheck="false" inputmode="text" />
        </div>

        <p id="pairError" class="error hidden"></p>
        <button id="pairGo" class="btn primary wide" type="button" data-i="pairGo"></button>

        <div class="or-sep">
          <span>أو / OR</span>
        </div>

        <button id="step2QrScan" class="btn ghost wide qr-step2-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> <span data-i="scanQrBtn"></span>
        </button>
      </section>
    </main>

    <!-- VIEW: CONNECTING spinner -->
    <main id="view-connecting" class="view hidden view-center">
      <div class="connect-anim">
        <div class="connect-ring"></div>
        <svg class="logo-center" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#0f766e" />
          <path d="M32 12v26M32 38l-9-9M32 38l9-9" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <path d="M16 48h32" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" />
        </svg>
      </div>
      <h2 id="connectingTitle" data-i="connecting"></h2>
      <p class="muted" id="connectingHint" data-i="connectingHint"></p>
      <button id="cancelConnect" class="btn ghost" type="button" data-i="cancel"></button>
    </main>

    <!-- MODAL: QR Scanner -->
    <div id="qrModal" class="qr-modal hidden" role="dialog" aria-modal="true">
      <div class="qr-backdrop" id="qrBackdrop"></div>
      <div class="qr-card">
        <div class="qr-card-header">
          <div class="qr-title-wrap">
            <span class="qr-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
            <h3 data-i="qrTitle"></h3>
          </div>
          <button id="closeQr" class="btn icon close-qr-btn" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <p class="muted small qr-hint-text" data-i="qrHint"></p>

        <div class="qr-viewfinder-wrap">
          <video id="qrVideo" playsinline autoplay muted></video>
          <canvas id="qrCanvas" class="hidden"></canvas>
          <div class="qr-frame">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <div class="qr-laser"></div>
          </div>
          <div id="qrFeedback" class="qr-feedback hidden"></div>
        </div>

        <p id="qrError" class="error hidden text-center"></p>

        <div class="qr-card-footer">
          <button id="qrTorchBtn" class="btn ghost icon" type="button" title="مصباح الفلاش"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
          <label class="btn ghost wide qr-file-btn" for="qrFileInput">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> <span data-i="qrPickImage"></span>
            <input type="file" id="qrFileInput" accept="image/*" class="hidden-input" />
          </label>
        </div>
      </div>
    </div>

    <footer>
      <p data-i="footerHint"></p>
      <p class="muted small"><span data-i="footerCompanion"></span> · <span id="ver">1.3.1</span></p>
    </footer>

    <!-- STANDALONE OFFLINE PRO MEDIA & DOCUMENT STUDIO OVERLAY -->
    <div id="studioOverlay" class="studio-overlay hidden" dir="rtl">
      <div class="studio-top">
        <div class="studio-top-title">
          <div style="display:flex;align-items:center;gap:8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
              <path d="M12 12v9"/>
              <path d="m8 17 4 4 4-4"/>
            </svg>
            <h2>استوديو ومشغل ملفات الهاتف الاحترافي</h2>
          </div>
          <p>الفيديوهات · الصوتيات · الصور · PDF · المستندات والجداول والنصوص</p>
        </div>
        <button id="closeStudioBtn" class="btn icon" type="button" aria-label="إغلاق">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="studio-toolbar">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="studioPickFilesBtn" class="btn primary compact" type="button" style="display:inline-flex;align-items:center;gap:6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>فتح ملفات من الهاتف</span>
          </button>
          <button id="studioClearBtn" class="btn ghost compact" type="button" style="display:inline-flex;align-items:center;gap:6px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            <span>مسح القائمة</span>
          </button>
          <input
            id="studioFileInput"
            type="file"
            multiple
            accept="video/*,audio/*,image/*,.pdf,.docx,.doc,.rtf,.odt,.csv,.tsv,.txt,.md,.json,.xml,.srt,.vtt,.log,.html,.js,.py"
            class="hidden-input"
          />
        </div>
        <input
          id="studioSearchInput"
          type="text"
          placeholder="بحث في الملفات..."
          class="field"
          style="width:170px;padding:6px 12px;font-size:12px;"
        />
      </div>

      <div class="studio-tabs">
        <button type="button" class="studio-tab active" data-cat="all">
          <span>الكل</span>
        </button>
        <button type="button" class="studio-tab" data-cat="video">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 6 4-6 4Z"/></svg>
          <span>فيديوهات</span>
        </button>
        <button type="button" class="studio-tab" data-cat="audio">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>صوتيات</span>
        </button>
        <button type="button" class="studio-tab" data-cat="image">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          <span>صور</span>
        </button>
        <button type="button" class="studio-tab" data-cat="doc">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>مستندات (PDF / Word / TXT)</span>
        </button>
      </div>

      <div id="studioBody" class="studio-body"></div>
    </div>

    <!-- ACTIVE FULLSCREEN PRO PLAYER MODAL -->
    <div id="studioPlayerModal" class="studio-player-modal hidden" dir="rtl">
      <div class="sp-header">
        <div style="min-width:0;flex:1;">
          <div id="spTitle" style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" dir="auto"></div>
          <div id="spMeta" style="font-size:11px;color:#94a3b8;"></div>
        </div>
        <div style="display:flex;gap:6px;">
          <button id="spPrevBtn" class="sp-btn" type="button" title="السابق">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
          </button>
          <button id="spNextBtn" class="sp-btn" type="button" title="التالي">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
          </button>
          <button id="spCloseBtn" class="sp-btn" type="button" style="background:rgba(244,63,94,0.22);border-color:rgba(244,63,94,0.45);color:#fda4af;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="spStage" class="sp-stage">
        <div id="spHud" class="sp-hud hidden"></div>
      </div>
      <div id="spControls" class="sp-controls"></div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="jsqr.js"></script>
    <script src="pdfjs/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
    <script src="studio.js"></script>
  </body>
</html>
